<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Pruitt Colon</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fcfcfa">
  <!-- GitHub Pages serves this file for any missing path, so every URL is root-absolute -->
  <link rel="icon" href="/assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    .not-found {
      min-height: calc(100dvh - var(--nav-h));
      display: grid;
      align-content: center;
      gap: var(--space-6);
      padding-block: var(--space-16);
    }

    .not-found__code {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      letter-spacing: 0.08em;
      color: var(--ink-3);
    }

    .not-found__actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-top: var(--space-4);
    }
  </style>
</head>

<body>
  <header class="site-nav">
    <div class="container site-nav__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">PC</span>
        <span>Pruitt Colon</span>
      </a>
    </div>
  </header>
  <main class="container not-found">
    <p class="not-found__code">ERROR 404</p>
    <h1 class="display">This page went <em>offline.</em></h1>
    <p class="lead">Unlike the rest of my work, that’s not on purpose. The page you’re looking for doesn’t exist or has
      moved.</p>
    <div class="not-found__actions">
      <a class="btn btn--primary btn--lg" href="/">Back to home</a>
      <a class="btn btn--secondary btn--lg" href="/#tour">Watch the product tour</a>
    </div>
  </main>
</body>

</html>
