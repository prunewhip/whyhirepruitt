<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Favicon source</title>
<meta name="robots" content="noindex">
<!-- Rendered by render-brand.mjs at 512×512, then downscaled to each icon size. -->
<style>
  @font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/geist-mono-latin-var.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
  .mark {
    position: relative; width: 512px; height: 512px; border-radius: 116px;
    background: linear-gradient(180deg, #1a1d22, #07080a);
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.08);
    display: grid; place-items: center;
    color: #f3f5f7; font-family: "Geist Mono", monospace; font-weight: 700; font-size: 220px; letter-spacing: -0.06em; line-height: 1;
  }
  .mark::after { content: ""; position: absolute; left: 150px; right: 150px; bottom: 104px; height: 18px; border-radius: 9px; background: #ff6b2c; }
  .mark span { transform: translateY(-22px); }
  body.full .mark { border-radius: 0; }
</style>
</head>
<body><div class="mark"><span>PC</span></div></body>
</html>
