<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glasses still</title>
<meta name="robots" content="noindex">
<!-- Renders the G1-style glasses alone on a transparent background, for the video -->
<style>
  @font-face { font-family: "Geist"; src: url("../../assets/fonts/geist-latin-var.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: transparent; }
  .stage { width: 1400px; height: 800px; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="stage"><canvas id="c"></canvas></div>
  <script type="module">
    import { createStage } from '../../js/3d/stage.js';
    import { createGlasses, hudTexture } from '../../js/3d/devices.js';
    window.ready = (async () => {
      const stage = createStage(document.getElementById('c'), { fov: 26 });
      stage.camera.position.set(0, 0, 6);
      await document.fonts.load('500 34px Geist');
      const g = createGlasses({ hud: hudTexture(['Claude:', 'Done. I will remind', 'you at 12:00.']) });
      g.group.rotation.set(0.16, 0.42, -0.03);
      g.group.position.set(0.2, -0.05, 0);
      g.group.scale.setScalar(1.35);
      stage.scene.add(g.group);
      stage.renderOnce(0);
      return 'ok';
    })().catch((e) => 'ERR ' + e.message);
  </script>
</body>
</html>
