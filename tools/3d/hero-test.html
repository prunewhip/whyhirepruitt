<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero scene test</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family: "Geist"; src: url("../../assets/fonts/geist-latin-var.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #101318; }
  .hero { position: relative; width: 100vw; height: 100vh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .phone { position: absolute; right: 12%; top: 14%; width: 300px; height: 640px; }
  .glasses { position: absolute; right: 30%; top: 58%; width: 300px; height: 150px; }
</style>
</head>
<body>
  <div class="hero">
    <canvas id="c"></canvas>
    <div class="phone" id="pa"></div>
    <div class="glasses" id="ga"></div>
  </div>
  <script type="module">
    import { mountHero } from '../../js/3d/devices-hero.js';
    const t = Number(new URLSearchParams(location.search).get('t') || 0);
    window.ready = mountHero({
      canvas: document.getElementById('c'),
      phoneAnchor: document.getElementById('pa'),
      glassesAnchor: document.getElementById('ga'),
      screens: ['../../assets/app/hd/vox-now.webp'],
      still: t
    }).then(() => 'ok', (e) => 'ERR ' + e.message);
  </script>
</body>
</html>
