<!doctype html><html lang="en"><head><meta charset="utf-8"><title>raw</title></head><body style="margin:0">
<canvas id="c" width="200" height="200"></canvas>
<script>
const gl=document.getElementById('c').getContext('webgl2',{preserveDrawingBuffer:true});
gl.clearColor(1,0.4,0.1,1); gl.clear(gl.COLOR_BUFFER_BIT);
const px=new Uint8Array(4); gl.readPixels(100,100,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
// triangle
const vs=gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs,'#version 300 es\nin vec2 p; void main(){gl_Position=vec4(p,0.,1.);}'); gl.compileShader(vs);
const fs=gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs,'#version 300 es\nprecision mediump float; out vec4 o; void main(){o=vec4(0.,1.,0.,1.);}'); gl.compileShader(fs);
const pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.linkProgram(pr);
const link=gl.getProgramParameter(pr,gl.LINK_STATUS); gl.validateProgram(pr); const val=gl.getProgramParameter(pr,gl.VALIDATE_STATUS);
gl.useProgram(pr); const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0); gl.drawArrays(gl.TRIANGLES,0,3);
const px2=new Uint8Array(4); gl.readPixels(100,100,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px2);
const RES=('clear='+px.join(',')+' tri='+px2.join(',')+' link='+link+' validate='+val+' vsOk='+gl.getShaderParameter(vs,gl.COMPILE_STATUS)+' vsLog='+gl.getShaderInfoLog(vs)+' fsOk='+gl.getShaderParameter(fs,gl.COMPILE_STATUS)+' fsLog='+gl.getShaderInfoLog(fs)+' err='+gl.getError()+' lost='+gl.isContextLost()); document.title='RES '+RES; window.ready=Promise.resolve(RES);
</script></body></html>
